<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{http.nf.title}}</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0f1115;--pan:#161a21;--bd:#262c36;--tx:#d7dce4;--mut:#7d8796;--chg:#f0a030;--lnk:#4aa3ff;--add:#3fb950;--del:#f85149}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 380px at 50% -8%,#1a2b47 0,transparent 70%) var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(520px,100%);text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:650;font-size:15px;color:var(--mut);margin-bottom:14px}
svg{width:100%;height:auto;color:var(--tx);overflow:visible}
h1{margin:6px 0 8px;font-size:26px;letter-spacing:-.02em}
p{margin:0 auto 6px;max-width:42ch;color:var(--mut)}p.joke{font-style:italic;opacity:.85}
.cta{display:inline-block;margin-top:18px;padding:9px 20px;border-radius:9px;color:#fff;text-decoration:none;font-weight:600;background:linear-gradient(135deg,#2f6fd0,#5a6ee8);box-shadow:0 1px 0 #ffffff30 inset,0 6px 20px #4a6fe544;transition:transform .15s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 1px 0 #ffffff30 inset,0 10px 26px #4a6fe577}.cta:active{transform:none}
.cta:focus-visible{outline:2px solid var(--lnk);outline-offset:3px}

/* escena: el logo de PR Peer en el centro busca con la mirada mientras el radar barre y las dudas orbitan */
.ring{fill:none;stroke:var(--lnk);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 3.6s ease-out infinite}
.ring2{animation-delay:1.2s}.ring3{animation-delay:2.4s}
.sweep,.orbit{transform-origin:200px 115px;animation:spin 6s linear infinite}
.orbit{animation-duration:16s}
.logo{animation:float 3s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.pupil{animation:look 7s ease-in-out infinite}
.q{font:700 22px Inter,system-ui,sans-serif;fill:var(--chg);transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite reverse,pulse 2.4s ease-in-out infinite}
.q2{animation-delay:0s,.8s}.q3{animation-delay:0s,1.6s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ping{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes look{0%,8%{transform:translate(0,0)}18%,30%{transform:translate(-1.6px,.4px)}40%,52%{transform:translate(1.4px,.4px)}62%,74%{transform:translate(-.6px,-1px)}86%,100%{transform:translate(0,0)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main>
  <div class="brand">PR Peer</div>
  <svg viewBox="0 0 400 230" role="img" aria-label="{{http.sessionNotFound}}">
    <defs>
      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="currentColor" stroke-opacity=".09"/></pattern>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4aa3ff" stop-opacity="0"/><stop offset="1" stop-color="#4aa3ff" stop-opacity=".35"/></linearGradient>
    </defs>
    <rect width="400" height="230" rx="16" fill="url(#grid)"/>
    <circle class="ring" cx="200" cy="115" r="60"/><circle class="ring ring2" cx="200" cy="115" r="60"/><circle class="ring ring3" cx="200" cy="115" r="60"/>
    <g class="sweep"><path d="M200 115L310 115A110 110 0 0 0 295 60Z" fill="url(#beam)"/></g>
    <g class="orbit">
      <text class="q q1" x="194" y="22">?</text><text class="q q2" x="285" y="175">?</text><text class="q q3" x="100" y="175">?</text>
    </g>
    <!-- logo (mismo dibujo que favicon.svg) a 3x, centrado en 200,115 -->
    <g class="logo"><g transform="translate(152 67) scale(3)">
      <rect width="32" height="32" rx="7" fill="#1f2937" stroke="#ffffff22" stroke-width=".4"/>
      <g class="eye"><circle cx="11.5" cy="16" r="4.6" fill="#f3f4f6"/><circle class="pupil" cx="12.6" cy="14.6" r="2" fill="#0f172a"/></g>
      <g class="eye"><circle cx="20.5" cy="16" r="4.6" fill="#f3f4f6"/><circle class="pupil" cx="21.6" cy="14.6" r="2" fill="#0f172a"/></g>
      <rect x="5" y="18" width="22" height="10" rx="3" fill="#f0a030"/><rect x="9" y="21.5" width="10" height="1.8" rx=".9" fill="#1f2937" opacity=".4"/><rect x="9" y="24.6" width="6" height="1.8" rx=".9" fill="#1f2937" opacity=".4"/>
    </g></g>
  </svg>
  <h1>{{http.nf.h}}</h1>
  <p>{{http.nf.p}}</p>
  <p class="joke">{{http.nf.joke}}</p>
  <a class="cta" href="/home">{{http.nf.cta}}</a>
</main>
<script src="/theme.js"></script>
</body></html>
